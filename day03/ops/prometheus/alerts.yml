# Xem tại http://localhost:9090/alerts. Gửi Slack/email cần Alertmanager (tuần 18).
groups:
  - name: weblab
    rules:
      - alert: WebLabDown
        expr: up{job="weblab"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "weblab không scrape được trong 1 phút"

      - alert: WebLabHighErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="weblab", http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count{job="weblab"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hơn 5% request trả 5xx"

      - alert: WebLabHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="weblab"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 500ms"
